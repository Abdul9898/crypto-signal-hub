name: 24/7 Crypto Signal Hub Runner

on:
  schedule:
    # Runs every 5 minutes automatically on GitHub cloud runners
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute High-Frequency 3m Scalper Engine
        run: node scanner.js

      - name: Commit and Persist Market State & Scalp Trades
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Auto-update high-frequency scalp trades and market state [skip ci]" || echo "No state changes to commit"
          git push
